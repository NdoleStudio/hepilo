name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

defaults:
  run:
    working-directory: ./web

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          npm rebuild better-sqlite3
          pnpm run postinstall

      - name: Lint
        run: pnpm run lint

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Generate static site
        run: pnpm run generate
        env:
          NUXT_PUBLIC_APP_NAME: Hepilo
          NUXT_PUBLIC_SITE_URL: https://hepilo.com
          NUXT_PUBLIC_SITE_EMAIL: arnold@hepilo.com
          NUXT_PUBLIC_SITE_ANDROID_APP_URL: https://play.google.com/store/apps/details?id=com.hepilo.twa
          NUXT_PUBLIC_GITHUB_LINK: https://github.com/NdoleStudio/hepilo
          NUXT_PUBLIC_COMMIT_HASH: ${{ github.sha }}
          NUXT_PUBLIC_RECAPTCHA_SITE_KEY: 6Le4-jseAAAAACQavdg0uBHEk6cIPnfQ-jRCYklA
          SENTRY_DSN: https://1e5300c5ad8449968a2edbd2fb25e255@o291224.ingest.sentry.io/6244114
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: web/.output/public
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: https://hepilo.com
    steps:
      - uses: actions/checkout@v7

      - name: Download static site
        uses: actions/download-artifact@v5
        with:
          name: static-site
          path: web/.output/public

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .output/public --project-name=hepilo
          workingDirectory: web
